# Persistence settings to save data across restarts
persistence true
persistence_location /mosquitto/data/

# Log settings
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Network settings
listener 1883
allow_anonymous false
password_file /mosquitto/config/password_file
# ACL par appareil (un utilisateur broker par Bourgeon). Le fichier est écrit par
# le backend (`telemetry/mosquitto.py`) et relu par Mosquitto sur SIGHUP — voir
# le service `mqtt-reloader` de docker-compose.yml. Le contenu versionné n'est
# qu'un amorçage.
acl_file /mosquitto/config/acl_file
